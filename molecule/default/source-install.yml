---
- name: Converge
  hosts: all
  # become: true

  vars:
    php_enable_webserver: false
    php_install_from_source: true
    php_source_clone_dir: /root/php-src
    php_source_make_command: "make --jobs=2"
    php_version: "7.4.8"
    php_source_version: "php-{{ php_version }}"
    php_memory_limit: "192M"

  pre_tasks:
    - name: Update apt cache.
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts.os_family == 'Debian'
      changed_when: false

  roles:
    - role: geerlingguy.git
    - role: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"

  post_tasks:
    - name: Confirm PHP configuration is correct.
      ansible.builtin.shell:
        cmd: set -o pipefail && php -i | grep 'memory_limit.*192'
        executable: /bin/bash
      changed_when: false

    - name: Check the installed PHP version.
      ansible.builtin.shell:
        cmd: set -o pipefail && /usr/bin/php --version | grep -qF "PHP {{ php_version }}"
        executable: /bin/bash
      changed_when: false
