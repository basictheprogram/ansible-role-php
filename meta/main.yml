galaxy_info:
  role_name: php
  namespace: realtime
  author: "Bob Tanner"
  description: >-
    Installs and configures PHP (CLI, FPM, OpCache, APCu) from distro
    packages or from source on RedHat/CentOS/Fedora and Debian/Ubuntu
    servers. Manages php.ini, PHP-FPM pool configs, and OpCache/APCu
    extension settings via templates.
  company: "Real Time Enterprises, Inc."
  license: MIT
  min_ansible_version: "2.20"
  issue_tracker_url: https://github.com/basictheprogram/ansible-role-php/issues
  platforms:
    - name: Fedora
      versions:
        - all
    - name: Debian
      versions:
        - bookworm  # 12
        - trixie    # 13
    - name: Ubuntu
      versions:
        - jammy    # 22.04
        - noble    # 24.04
        - resolute # 26.04
    - name: EL
      versions:
        - "9"
        - "10"
