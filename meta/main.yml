dependencies: []

galaxy_info:
  role_name: php
  namespace: realtime
  author: "Bob Tanner"
  description: >-
    Installs and configures PHP (CLI, FPM, OpCache, APCu) from distro
    packages or from source, and manages php.ini, PHP-FPM pool configs,
    and OpCache/APCu extension settings via templates. Targets Debian
    (trixie), Ubuntu (jammy, noble, resolute), EL 9/10
    (RHEL/CentOS/Rocky/AlmaLinux), and current Fedora releases.
  company: "Real Time Enterprises, Inc."
  license: MIT
